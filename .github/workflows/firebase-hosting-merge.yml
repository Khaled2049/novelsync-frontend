name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGE_SENDER_ID: ${{ secrets.FIREBASE_MESSAGE_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      VITE_THIRDWEB_CLIENT_ID: ${{ vars.VITE_THIRDWEB_CLIENT_ID }}
      VITE_USDC_TOKEN_ADDRESS: ${{ vars.VITE_USDC_TOKEN_ADDRESS }}
      VITE_TIPPING_CONTRACT_ADDRESS: ${{ vars.VITE_TIPPING_CONTRACT_ADDRESS }}
      VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
      VITE_MAX_AI_USAGE: ${{ vars.VITE_MAX_AI_USAGE }}
    steps:
      - uses: actions/checkout@v4
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVELSYNC_F82EC }}
          channelId: live
          projectId: novelsync-f82ec
