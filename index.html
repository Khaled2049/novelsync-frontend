<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>%VITE_APP_NAME% - AI-Powered Novel Writing Platform</title>
    <meta
      name="title"
      content="%VITE_APP_NAME% - AI-Powered Novel Writing Platform"
    />
    <meta
      name="description"
      content="Create, organize, and enhance your stories with AI-powered writing assistants. Join book clubs, discover stories, and connect with writers in a collaborative writing community."
    />
    <meta
      name="keywords"
      content="novel writing, AI writing assistant, story creation, book clubs, writing platform, creative writing, storytelling, author tools, writing community, story collaboration"
    />
    <meta name="author" content="%VITE_APP_NAME% Team" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/book.svg" />
    <link rel="apple-touch-icon" href="/book.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta
      property="og:title"
      content="%VITE_APP_NAME% - AI-Powered Novel Writing Platform"
    />
    <meta
      property="og:description"
      content="Create, organize, and enhance your stories with AI-powered writing assistants. Join book clubs, discover stories, and connect with writers in a collaborative writing community."
    />
    <meta property="og:image" content="/book.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="%VITE_APP_NAME% - AI-Powered Novel Writing Platform"
    />
    <meta
      name="twitter:description"
      content="Create, organize, and enhance your stories with AI-powered writing assistants. Join book clubs, discover stories, and connect with writers in a collaborative writing community."
    />
    <meta name="twitter:image" content="/book.svg" />

    <!-- Theme -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
