version: '3.8'

services:
  python-agent:
    build:
      context: ../novelsync-agents
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GOOGLE_CLOUD_PROJECT=novelsync-f82ec
      - FIRESTORE_EMULATOR_HOST=host.docker.internal:8080
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
      - GOOGLE_AI_STUDIO_MODEL=gemini-2.0-flash-exp
      - ENVIRONMENT=development
      - ENABLE_LOCAL_IMAGE_GENERATION=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
